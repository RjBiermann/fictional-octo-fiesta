# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # Deliberate pin: Jackson >2.13.1 breaks older Android devices
      # (build.gradle.kts). Dependabot otherwise re-opens the bump weekly.
      # Exact coordinates, not `com.fasterxml.jackson*`: the group-level glob
      # never matched the Maven coordinate, so Dependabot kept spawning update
      # jobs that failed `dependency_not_found` (5 of 6 runs, #1592).
      - dependency-name: "com.fasterxml.jackson.core:jackson-core"
      - dependency-name: "com.fasterxml.jackson.core:jackson-databind"
      - dependency-name: "com.fasterxml.jackson.core:jackson-annotations"
      # Pinned: CodeQL's Kotlin extractor cannot parse newer Kotlin Gradle
      # plugins; codeql.yml downgrades to 2.4.10 to build (ADR-0010).
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
