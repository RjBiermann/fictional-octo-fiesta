name: Agent runtime
description: >
  Install the agent runtime (pi, ponytail, caveman, rtk), write the
  OpenCode Go model config, and regenerate the caveman pi extension. Shared by
  all agent workflows; secrets are passed at the call site as step env.

runs:
  using: composite
  steps:
    # Pre-flight: fail broken plumbing (.github/workflows + actions) in seconds,
    # not after a full model run dies at deliver-pr load time (see ADR-0004).
    # All callers have checked out before invoking this action.
    - name: Pre-flight actionlint
      uses: reviewdog/action-actionlint@v1
      with:
        reporter: github-check
        fail_level: error

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    - name: Install pi, ponytail, caveman, rtk
      shell: bash
      run: |
        npm i -g @earendil-works/pi-coding-agent >/dev/null 2>&1
        npm i -g @dietrichgebert/ponytail >/dev/null 2>&1
        npm i -g @caveman-ai/cli >/dev/null 2>&1
        pi install npm:@dietrichgebert/ponytail >/dev/null
        # rtk: static binary, token-savings bash rewrites (needs >= 0.23)
        curl -sL -o /tmp/rtk.tgz \
          https://github.com/rtk-ai/rtk/releases/latest/download/rtk-x86_64-unknown-linux-musl.tar.gz
        mkdir /tmp/rtkx && tar -xzf /tmp/rtk.tgz -C /tmp/rtkx
        install -m755 "$(find /tmp/rtkx -name rtk -type f | head -1)" /usr/local/bin/rtk
        rtk --version

    - name: Model config (OpenCode Go)
      shell: bash
      run: |
        mkdir -p ~/.pi/agent
        cat > ~/.pi/agent/models.json <<'JSON'
        {
          "providers": {
            "go": {
              "baseUrl": "https://opencode.ai/zen/go/v1",
              "api": "openai-completions",
              "apiKey": "$OPENCODE_API_KEY",
              "models": [
                { "id": "glm-5.3-flash", "name": "GLM 5.3 Flash (Go)", "reasoning": true },
                { "id": "deepseek-v4-flash", "name": "DeepSeek V4 Flash (Go)", "reasoning": true }
              ]
            }
          }
        }
        JSON

    - name: Enable caveman for pi (fail-open by absence)
      shell: bash
      run: |
        # pi auto-loads ~/.pi/agent/extensions/* — if generation fails there is
        # no file and nothing loads; never write an empty stub (pi rejects it)
        caveman enable pi >/dev/null 2>&1 || true
        ls -la ~/.pi/agent/extensions/ 2>/dev/null || true
