name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew test make makePluginsJson
          cp -- */build/*.cs3 "$GITHUB_WORKSPACE/builds"
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"
          cp repo.json "$GITHUB_WORKSPACE/builds"

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force

      - name: Mirror builds branch to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          # token via env + host-scoped extraheader, never inline in the URL (P0-1)
          B64=$(printf 'x-access-token:%s' "$CODEBERG_TOKEN" | base64 -w0)
          git config http.https://codeberg.org/.extraheader "AUTHORIZATION: basic $B64"
          git push --force "https://codeberg.org/RjBiermann/fictional-octo-fiesta.git" HEAD:builds
