name: 90-sweeper
# Plain NON-AI Actions workflow (ADR-0006): self-healing survives the Sweep.
# Re-fires stuck state labels, parses budget stamps, posts the weekly
# status report. Probability reducer, not a guarantee (Actions may skip
# cron under load). Label mutations act through the machinery GitHub App
# token (ADR-0020) so the re-added label event is App-actor — GITHUB_TOKEN
# label events fire no workflows. Until the relay targets' on.bots
# allowlists learn the App login, a re-add stays bookkeeping-only and
# the orchestrator's own schedule sweep heals instead (same degradation
# as the retired PAT-unset path). The machinery App is a trusted labeler
# by design (migration-design §2 gate table).
on:
  schedule:
    - cron: "17 */4 * * *"   # 4h, off-the-hour minute to dodge Actions load
  workflow_dispatch:
    inputs:
      mode:
        description: heal | report | both
        default: both
        type: choice
        options: [heal, report, both]

permissions:
  contents: read
  issues: write

concurrency:
  group: sweeper
  cancel-in-progress: false

env:
  STUCK_HOURS: "12"          # state label idle longer than this re-fires
  DAILY_ATTEMPT_CAP: "10"    # gate-stamp attempts per issue per day
  MAX_ATTEMPTS: "20"         # lifetime attempt cap before escalation
  BUDGET_PREFIX: "gh-aw budget:"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'both' }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/issues?state=open&per_page=100" \
            --paginate --jq '.[] | select(has("pull_request") | not)' > issues.json
          wc -l < issues.json

      # ADR-0020: the machinery GitHub App provides the mutation identity
      # (GITHUB_TOKEN label events fire no workflows). Legacy env name
      # GH_AW_PROXY_PAT is kept — the sweep script consumes it generically;
      # unset (App unregistered) degrades to bookkeeping-only, below.
      - name: Machinery App token
        id: machinery_token
        if: inputs.mode != 'report' && vars.MACHINERY_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.MACHINERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.MACHINERY_APP_KEY }}

      - name: Parse ledger + heal stuck labels
        if: inputs.mode != 'report'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_AW_PROXY_PAT: ${{ steps.machinery_token.outputs.token }}
          REPO: ${{ github.repository }}
          STUCK_HOURS: ${{ env.STUCK_HOURS }}
          DAILY_ATTEMPT_CAP: ${{ env.DAILY_ATTEMPT_CAP }}
          MAX_ATTEMPTS: ${{ env.MAX_ATTEMPTS }}
          BUDGET_PREFIX: ${{ env.BUDGET_PREFIX }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, datetime
          repo, stuck_h = os.environ["REPO"], int(os.environ["STUCK_HOURS"])
          cap_d, cap_max, pref = (int(os.environ["DAILY_ATTEMPT_CAP"]),
                                  int(os.environ["MAX_ATTEMPTS"]),
                                  os.environ["BUDGET_PREFIX"])
          states = {"status/planned","status/in-review","status/fixing",
                    "status/fixing-stuck","status/ready-to-merge"}
          day = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          # Label mutations act as the machinery App (ADR-0020): a
          # GITHUB_TOKEN label event neither fires a workflow nor passes
          # gh-aw activation. Soft fallback: without the App token the
          # sweep stays bookkeeping-only (visible via this warning).
          if os.environ.get("GH_AW_PROXY_PAT"):
              os.environ["GH_TOKEN"] = os.environ["GH_AW_PROXY_PAT"]
          else:
              print("::warning::machinery App token unavailable — re-fires will not re-trigger agent workflows")
          def gh(*a):
              r = subprocess.run(["gh",*a], capture_output=True, text=True)
              if r.returncode != 0:
                  raise RuntimeError(f"gh {' '.join(a[:3])}: {r.stderr.strip()[:160]}")
          # --paginate emits one JSON value per page concatenated — NOT one
          # document. json.load dies with "Extra data" from the 2nd value.
          # Tolerant parse: stream-decode every whitespace-separated value.
          raw = open("issues.json").read()
          dec, i, items = json.JSONDecoder(), 0, []
          while i < len(raw):
              while i < len(raw) and raw[i] in " \n\r\t":
                  i += 1
              if i >= len(raw):
                  break
              obj, i = dec.raw_decode(raw, i)
              items.extend(obj if isinstance(obj, list) else [obj])
          for it in items:  # fail soft per issue: one bad call must not kill the sweep
              try:
                  n = it["number"]
                  labels = {l["name"] for l in it["labels"]}
                  st = labels & states
                  upd = datetime.datetime.fromisoformat(it["updated_at"].replace("Z","+00:00"))
                  idle_h = (datetime.datetime.now(datetime.timezone.utc)-upd).total_seconds()/3600
                  out = subprocess.run(["gh","api",f"repos/{repo}/issues/{n}/comments",
                                        "--paginate","--jq",".[].body"],
                                       capture_output=True,text=True).stdout
                  stamps = [l for l in out.splitlines() if l.strip().startswith(pref)]
                  # A historical `reset` must re-arm escalation: counts resume
                  # from the last reset stamp, not from zero-forever.
                  reset_idx = max((i for i, l in enumerate(stamps) if "reset" in l), default=-1)
                  tail = stamps[reset_idx + 1:]
                  today  = sum(day in l for l in tail)          # daily budget
                  budget = sum("attempt=" in l for l in tail)   # max_attempts
                  # 1) Attempt caps -> escalate
                  if st and budget >= cap_max:
                      if "status/fixing-stuck" not in labels:
                          gh("issue","edit",str(n),"--repo",repo,
                             "--add-label","status/fixing-stuck")
                          gh("issue","comment",str(n),"--repo",repo,
                             "--body",f"{pref} escalated: {budget} attempts; needs human.")
                      continue
                  # 2) Daily cap -> skip this round
                  if today >= cap_d:
                      continue
                  # 3) Stuck -> re-fire by remove+re-add of the state label
                  if st and idle_h > stuck_h:
                      for lb in sorted(st):
                          gh("issue","edit",str(n),"--repo",repo,"--remove-label",lb)
                          gh("issue","edit",str(n),"--repo",repo,"--add-label",lb)
                      names = ", ".join(sorted(st))
                      gh("issue","comment",str(n),"--repo",repo,
                         "--body",f"{pref} re-fired: `{names}` idle {int(idle_h)}h.")
              except Exception as e:
                  print(f"issue {it.get('number','?')} skipped: {e}")
          EOF

      - name: Weekly status report (devloop status successor)
        if: inputs.mode != 'heal'
        env:
          INPUT_MODE: ${{ inputs.mode == '' && 'both' || inputs.mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Monday fires at the 00:xx run only — the 4h cron runs 6×/day and
          # every Monday run would otherwise post a duplicate [status-report].
          [ "$INPUT_MODE" = "report" ] || { [ "$(date +%u)" = "1" ] && [ "$(date +%H)" = "00" ]; } || exit 0
          gh issue list --repo "$REPO" --state open --json number,title,labels > issues-report.json
          python3 -c 'import json;items=json.load(open("issues-report.json"));print("## Open issue state\n"+"\n".join("- #%d %s %s"%(i["number"],i["title"]," ".join(l["name"] for l in i["labels"])) for i in items) or "(none)")' > status-report.md
          gh issue create --repo "$REPO" \
            --title "[status-report] weekly $(date +'%Y-%m-%d')" \
            --body-file status-report.md
