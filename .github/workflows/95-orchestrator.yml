name: Orchestrator (mechanical conveyor — approvals, readiness, chain, surrogate)

# ADR-0017 (amended 2026-10-15): non-AI plain Actions, sibling of
# 90-sweeper. Automates mechanics; surfaces decisions as @mentions;
# humans still merge PRs by default (GH_AW_AUTO_MERGE=false).

on:
  schedule:                 # background sweep (GitHub throttles schedules under
    - cron: "*/10 * * * *"  # load; event triggers carry the chain latency)
  workflow_dispatch:
  issues:
    types: [opened, labeled]      # fresh trigger labels / new specs go instantly
  issue_comment:
    types: [created]              # human plan-round answers / `approved` / decision
                                  # tags resolve in seconds, not at the next throttled
                                  # sweep (the surrogate re-derives state, so bot-comment
                                  # triggers are just churn, never lost work)
  pull_request:
    types: [closed]               # chain advance immediately after a merge
  pull_request_review:
    types: [submitted]            # human review verdicts reach the fix-loop without
                                  # waiting for a schedule slot

permissions:
  # contents: write — 16-f6b pushes union-merge commits to resolve the
  # findings.json conflict class mechanically (checkout embeds the actions
  # token for git transport). All other mutations act as the machinery App
  # (ADR-0020) when registered, else github-actions[bot] via GITHUB_TOKEN
  # (ADR-0019).
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Concurrency is evaluated when the run starts, before any job `if`, so a
  # bot-triggered run would still cancel the live sweep even though its job
  # is skipped. The churn channels get their own group: those runs cancel
  # each other and never touch the real one (87 of the last 100 runs were
  # cancelled before this split, #1437/#1467).
  #
  # Scoped to the churn channels only: bot `issues: labeled` (the
  # status/queued -> ai-fix path) and bot merge events (genuine chain
  # advance) stay on the real group, and human comments still supersede each
  # other, which is what CONTEXT.md's "add/remove pairs cannot interleave"
  # invariant relies on.
  group: >-
    orchestrator-${{
    ((github.event_name == 'issue_comment' && github.event.comment.user.type == 'Bot')
    || (github.event_name == 'pull_request_review' && github.event.review.user.type == 'Bot')
    || (github.event_name == 'issues' && github.event.action == 'opened'
    && github.event.issue.user.type == 'Bot')) && 'noop' || 'main' }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # The comment trigger exists for HUMAN round answers ("approved", a
    # decision tag) so they resolve in seconds. Agent/machinery comments are
    # churn by this file's own account — and with `cancel-in-progress: true`
    # each one killed the sweep that the previous comment had just started:
    # 87 of the last 100 conveyor runs were cancelled, which is why a close
    # comment could post with no close behind it (2026-11-21). The schedule
    # re-derives state, so skipping bot comments loses no work.
    # The churn channels must not EXECUTE either: a skipped run under a
    # separate concurrency group would otherwise sweep CONCURRENTLY with the
    # real one, and this sweep is read-then-act with no in-script lock
    # (duplicate Implement fires, double surrogate dispatch, label
    # delete/add races). Verdicts still reach fix_surrogate() through the
    # issue comments it reads, so skipping these costs nothing.
    if: >-
      (github.event_name != 'issue_comment'
       || github.event.comment.user.type != 'Bot')
      && (github.event_name != 'pull_request_review'
          || github.event.review.user.type != 'Bot')
      && (github.event_name != 'issues'
          || github.event.action != 'opened'
          || github.event.issue.user.type != 'Bot')
    
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: conflict_watch's merge-tree needs a common base
          # between origin/main and the branch ref (shallow checkouts fail
          # "refusing to merge unrelated histories")
          fetch-depth: 0

      # ADR-0020: the machinery GitHub App replaces the retired owner PAT
      # (GH_AW_PROXY_PAT as a legacy env name — orchestrator.py consumes it
      # generically). Unset (App unregistered) degrades per ADR-0019:
      # everything runs under GITHUB_TOKEN; PAT-era extras stay manual.
      - name: Machinery App token
        id: machinery_token
        if: vars.MACHINERY_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.MACHINERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.MACHINERY_APP_KEY }}

      - name: Run the mechanical conveyor
        env:
          # GITHUB_TOKEN is NOT an env var by default (it's a secret/context
          # value only) — orchestrator.py's dispatch_ok reads it to send
          # relay dispatches under github-actions[bot] (the identity gh-aw's
          # activation gate authorizes; the machinery App is never a
          # collaborator and fails closed there, #875/#879 round 2).
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_AW_PROXY_PAT: ${{ steps.machinery_token.outputs.token }}
          GH_AW_AUTO_MERGE: ${{ vars.GH_AW_AUTO_MERGE }}
          GH_AW_ORCH_PLAN: ${{ vars.GH_AW_ORCH_PLAN }}
          GH_AW_ORCH_TAG_OWNER: ${{ vars.GH_AW_ORCH_TAG_OWNER }}
          GH_AW_ORCH_OWNER: ${{ vars.GH_AW_ORCH_OWNER }}
          # wave driver parallelism — previously unwired (code default 8
          # was the only effective value); adopters set the repo variable
          # to throttle concurrent Implement runs (ADR-0014).
          GH_AW_ORCH_WAVE_CAP: ${{ vars.GH_AW_ORCH_WAVE_CAP }}
          # repo-agnostic adopter config: the append-only JSON registry
          # enables the mechanical findings/registry conflict auto-merge;
          # comma list of version-file suffixes (default build.gradle.kts).
          # An adopter that configures neither keeps every conflict human.
          GH_AW_REGISTRY_PATH: ${{ vars.GH_AW_REGISTRY_PATH }}
          GH_AW_REGISTRY_VERSION_FILES: ${{ vars.GH_AW_REGISTRY_VERSION_FILES }}
        run: python3 .github/orchestrator.py
