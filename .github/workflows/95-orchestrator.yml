name: Orchestrator (mechanical conveyor — approvals, merge, chain)

# ADR-0008: the maintainer's session-side orchestration lives on GitHub.
# Non-AI by design — no engine, no agent; a state-machine citizen like
# 90-sweeper. Human decision points remain: ai-* trigger labels, the plan
# loop's `approved`, human-authored PR reviews, and any stuck state.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: orchestrator
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Approve companion runs stuck in action_required
        # Bot-authored devloop/* PRs put every workflow on the branch into
        # action_required (the author actor has no write role). Approving the
        # NON-AI companion checks is mechanical; agent-workflow runs of the
        # gh-aw family are excluded — those stay visible pending human
        # attention by design. Needs an admin PAT (GH_AW_PROXY_PAT); the
        # step warns and no-ops when the secret is unset.
        env:
          PROXY_PAT: ${{ secrets.GH_AW_PROXY_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PROXY_PAT}" ]]; then
            echo "::warning::GH_AW_PROXY_PAT unset — approval step skipped (runs stay action_required until a maintainer approves)"
            exit 0
          fi
          ALLOWLIST=$(printf '%s\n' \
            "99-ci" \
            "Lint" \
            "CodeQL Advanced" \
            "CodeQL" \
            "Security scan (08+09 merged)" \
            "Automatic Dependency Submission (Gradle)")
          for b in $(gh pr list --json headRefName,state \
              --jq '.[] | select(.state=="open") | .headRefName' | grep '^devloop/' || true); do
            gh run list --branch "$b" --limit 40 --json databaseId,workflowName,conclusion \
              --jq '.[] | select(.conclusion=="action_required") | [.databaseId,.workflowName] | @tsv' |
            while IFS=$'\t' read -r rid wname; do
              [[ -z "$rid" ]] && continue
              if grep -qxF "${wname}" <<<"$ALLOWLIST"; then
                code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                  -H "Authorization: Bearer ${PROXY_PAT}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/${rid}/approve")
                echo "run ${rid} (${wname}): approve -> HTTP ${code}"
              else
                echo "run ${rid} (${wname}): outside companion allowlist — left for human"
              fi
            done
          done

      - name: Enable auto-merge on spec-chain PRs
        # Human decision was made once per chain (round-3 `approved`); the
        # per-PR merge moment is mechanical when every required context is
        # green — `--auto` queues the squashed merge so branch protection
        # itself remains the actual gate. Switch off via repo variable
        # GH_AW_AUTO_MERGE=false to return merges to the maintainer's hand.
        env:
          AUTO_MERGE: ${{ vars.GH_AW_AUTO_MERGE }}
        run: |
          set -euo pipefail
          if [[ "${AUTO_MERGE:-true}" != "true" ]]; then
            echo "GH_AW_AUTO_MERGE!=true — auto-merge disabled by adopter; merges stay manual"
            exit 0
          fi
          for pr in $(gh pr list --json number,headRefName,isDraft,state \
              --jq '.[] | select((.state=="open") and (.isDraft|not)) |
                    select((.headRefName|startswith("devloop/issue-"))) | .number'); do
            gh pr merge "$pr" --squash --auto >/dev/null 2>&1 \
              && echo "PR $pr: auto-merge queued" \
              || echo "PR $pr: not mergeable yet (protection checks pending)"
          done

      - name: Drive the story chain (next sibling gets the trigger)
        # Plan round-3 creates [spec] Story sub-issues unlabeled. When story
        # N-1's sub-issue closes (its PR merged), story N is authorized by
        # the chain's round-3 approval — so stamp status/planned. Never
        # touches ai-* (those stay human-only).
        run: |
          set -euo pipefail
          gh issue list --state open --json number,title,labels \
            --jq '.[] | select((.title|startswith("[spec]"))) | select((.labels | map(.name) | index("status/planned") | not)) | "\(.number)|||\(.title)"' |
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            n="${line%%|||*}"; t="${line#*|||}"
            nown=$(echo "$t" | grep -oE 'Story[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | tail -1)
            [[ -z "$nown" ]] && continue
            prev=$((nown - 1)); [[ "$prev" -lt 1 ]] && { echo "story ${nown} (issue ${n}): first story of chain — waiting on human"; continue; }
            pstate=$(gh issue list --state all --search "[spec] Story ${prev} in:title" --limit 1 \
              --json state --jq '.[0].state // "-"')
            if [[ "$pstate" == "CLOSED" ]]; then
              gh issue edit "$n" --add-label status/planned >/dev/null \
                && echo "story ${nown} (issue ${n}): trigger stamped (story ${prev} merged)"
            else
              echo "story ${nown} (issue ${n}): predecessor story ${prev} still ${pstate}"
            fi
          done

      - name: Watchdog — close transient [aw] diagnostics after a later success
        # The transient class (empty gateway completion mid-turn) has its gh-aw
        # gate; closing repeats-of-known-shape here keeps the maintainer cycle
        # off re-runs. Guard: only when a LATER successful Implement/Plan run
        # exists after the diagnostic's creation timestamp.
        run: |
          set -euo pipefail
          ml=$(gh issue list --state open --search 'is:issue author:app/github-actions "[aw]" in:title' --limit 20 \
            --json number,title,createdAt \
            --jq '[.[] | select(((.title|contains("no safe outputs")) or (.title|contains("reported incomplete"))) and (.title|startswith("[aw]"))) | [.number,.createdAt] | @tsv]')
          later_ok=$(gh run list --limit 50 --json name,conclusion,createdAt \
            --jq '.[] | select((.conclusion=="success") and (((.name|contains("Implement"))) or ((.name|contains("Plan"))))) | .createdAt' | sort -u)
          while IFS=$'\t' read -r n created; do
            [[ -z "$n" ]] && continue
            found=$(printf '%s\n' "$later_ok" | awk -v t="$created" '($0 > t){f=1} END{print f+0}')
            if [[ "$found" == "1" ]]; then
              gh issue close "$n" --reason "not planned" \
                -c "Transient-class \`[aw]\` signal: at least one later Implement/Plan run succeeded after this diagnostic's timestamp (orchestrator watchdog, ADR-0008). If the underlying work is still missing, reopen with the specific evidence." >/dev/null 2>&1 \
                && echo "closed transient diag #${n}" || true
            else
              echo "diag #${n}: no later success — left open for human"
            fi
          done <<< "$ml"
