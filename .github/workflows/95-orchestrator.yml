name: Orchestrator (mechanical conveyor — approvals, readiness, chain, surrogate)

# ADR-0017 (amended 2026-10-15): non-AI plain Actions, sibling of
# 90-sweeper. Automates mechanics; surfaces decisions as @mentions.
# Humans merge — machinery auto-merges only when the chain's owner-approval
# receipt exists (`GH_AW_AUTO_MERGE=true` since ADR-0018; the repo variable
# is what gates it, not this comment).

on:
  schedule:                 # fallback sweep only: GitHub runs this */10 cron a
    - cron: "*/10 * * * *"  # few times a day here (~4-8h), so the event
                            # triggers below carry the chain latency
  workflow_dispatch:
  issues:
    types: [opened, labeled]      # fresh trigger labels / new specs go instantly
  issue_comment:
    types: [created]              # human plan-round answers / `approved` / decision
                                  # tags resolve in seconds, not at the next throttled
                                  # sweep (the surrogate re-derives state, so bot-comment
                                  # triggers are just churn, never lost work)
  pull_request:
    types: [closed]               # chain advance immediately after a merge
  pull_request_review:
    types: [submitted]            # human review verdicts reach the fix-loop without
                                  # waiting for a schedule slot
  workflow_run:                   # the sweep an agent verdict cannot trigger: 06
    # posts its verdict under GITHUB_TOKEN, so GitHub fires no event for it
    # (that is why fix_surrogate() exists) and the schedule was the only path
    # left — which GitHub throttles to ~4-8h here (40 scheduled runs in 11
    # days). #1516's blocker waited 46 min for a human to type /repair.
    # workflow_run is the one event that still fires for GITHUB_TOKEN-
    # completed runs, and the verdict exists by then (safe_outputs runs
    # before `conclusion`). Cancelled runs carry no verdict and their
    # superseding run completes anyway; `skipped` is the bot-comment churn
    # channel (6b skips on nearly every bot review comment, ~180/day) and must
    # not sweep — both are dropped by the job `if`.
    workflows:
      - "Review (findings only; ADR-0001 semantics preserved)"
      - "Review (command — findings only; ADR-0001 semantics)"
    types: [completed]

permissions:
  # contents: write — 16-f6b pushes union-merge commits to resolve the
  # findings.json conflict class mechanically (checkout embeds the actions
  # token for git transport). All other mutations act as the machinery App
  # (ADR-0020) when registered, else github-actions[bot] via GITHUB_TOKEN
  # (ADR-0019).
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Churn channels get their own group so their runs never occupy — let alone
  # cancel — the real sweep's slot (87 of the last 100 runs were cancelled
  # before this split, #1437/#1467). They are also skipped by the job `if`,
  # so a churn run costs a few seconds of its own queue at most.
  #
  # Scoped to the churn channels only: bot `issues: labeled` (the
  # status/queued -> ai-fix path) and bot merge events (genuine chain
  # advance) stay on the real group. Human comments no longer supersede a
  # running sweep either — they queue behind it (see below), which is what
  # keeps GLOSSARY.md's "add/remove pairs cannot interleave" invariant true.
  group: >-
    orchestrator-${{
    ((github.event_name == 'issue_comment' && github.event.comment.user.type == 'Bot')
    || (github.event_name == 'pull_request_review' && github.event.review.user.type == 'Bot')
    || (github.event_name == 'issues' && github.event.action == 'opened'
    && github.event.issue.user.type == 'Bot')
    || (github.event_name == 'workflow_run'
    && (github.event.workflow_run.conclusion == 'skipped'
    || github.event.workflow_run.conclusion == 'cancelled'))) && 'noop' || 'main' }}
  # NOT cancel-in-progress. A sweep takes ~12 minutes and events arrive every
  # few seconds during active work, so cancelling the in-flight sweep on every
  # event meant none ever finished: 22:37-22:43 today produced six cancelled
  # runs and zero completed ones, so a conflict that needed the sweep's
  # conflict_watch was never looked at (#1466). With queueing, the running
  # sweep always completes and one pending run supersedes older pendings — a
  # burst collapses to "current + next", and each sweep is idempotent state
  # reconciliation anyway.
  #
  # Steady state under load: the queue is never empty, so pending runs are
  # routinely superseded before they start. Human-answer latency is therefore
  # one to two sweeps (~12-24 min), not seconds — the price of every sweep
  # finishing. Nothing is lost: orchestrator.py reads no GITHUB_EVENT_PATH,
  # so every step re-derives from the API and a superseded run would have
  # reached the same verdict.
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # A sweep takes 12-14 min. With queueing instead of cancellation, a hung
    # fetch/gh call would otherwise hold the queue for the 360-minute job
    # default and block the schedule and every event trigger behind it —
    # nothing else can cancel it (the in-sweep watchdog() only covers what it
    # can see).
    # The comment trigger exists for HUMAN round answers ("approved", a
    # decision tag) so they resolve in seconds. Agent/machinery comments are
    # churn by this file's own account — and with `cancel-in-progress: true`
    # each one killed the sweep that the previous comment had just started:
    # 87 of the last 100 conveyor runs were cancelled, which is why a close
    # comment could post with no close behind it (2026-11-21). The schedule
    # re-derives state, so skipping bot comments loses no work.
    # The churn channels must not EXECUTE either: a skipped run under a
    # separate concurrency group would otherwise sweep CONCURRENTLY with the
    # real one, and this sweep is read-then-act with no in-script lock
    # (duplicate Implement fires, double surrogate dispatch, label
    # delete/add races). Verdicts still reach fix_surrogate() through the
    # issue comments it reads, so skipping these costs nothing.
    if: >-
      (github.event_name != 'issue_comment'
       || github.event.comment.user.type != 'Bot')
      && (github.event_name != 'pull_request_review'
          || github.event.review.user.type != 'Bot')
      && (github.event_name != 'issues'
          || github.event.action != 'opened'
          || github.event.issue.user.type != 'Bot')
      && (github.event_name != 'workflow_run'
          || (github.event.workflow_run.conclusion != 'cancelled'
              && github.event.workflow_run.conclusion != 'skipped'))
    
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The sweep runs with `contents/issues/pull-requests/actions: write`
          # and a minted App token, and `orchestrator.py` is not a workflow
          # file (gh-aw's protected-commit guard does not cover it). On the
          # `pull_request: [closed]` arm the default ref is the PR merge
          # commit, so a closed-but-unmerged PR that edits orchestrator.py
          # would run its own version of the conveyor with those tokens.
          # Pin the code to the default branch: the state logic is never
          # supposed to come from the PR under test.
          ref: ${{ github.event.repository.default_branch }}
          # full history: conflict_watch's merge-tree needs a common base
          # between origin/main and the branch ref (shallow checkouts fail
          # "refusing to merge unrelated histories"). depth 0 fetches every
          # remote branch, so `ref:` above narrows the tree, not the refs.
          fetch-depth: 0

      # ADR-0020: the machinery GitHub App replaces the retired owner PAT
      # (GH_AW_PROXY_PAT as a legacy env name — orchestrator.py consumes it
      # generically). Unset (App unregistered) degrades per ADR-0019:
      # everything runs under GITHUB_TOKEN; PAT-era extras stay manual.
      - name: Machinery App token
        id: machinery_token
        if: vars.MACHINERY_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.MACHINERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.MACHINERY_APP_KEY }}

      - name: Run the mechanical conveyor
        env:
          # GITHUB_TOKEN is NOT an env var by default (it's a secret/context
          # value only) — orchestrator.py's dispatch_ok reads it to send
          # relay dispatches under github-actions[bot] (the identity gh-aw's
          # activation gate authorizes; the machinery App is never a
          # collaborator and fails closed there, #875/#879 round 2).
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GH_AW_PROXY_PAT: ${{ steps.machinery_token.outputs.token }}
          GH_AW_AUTO_MERGE: ${{ vars.GH_AW_AUTO_MERGE }}
          GH_AW_ORCH_PLAN: ${{ vars.GH_AW_ORCH_PLAN }}
          GH_AW_ORCH_TAG_OWNER: ${{ vars.GH_AW_ORCH_TAG_OWNER }}
          GH_AW_ORCH_OWNER: ${{ vars.GH_AW_ORCH_OWNER }}
          # wave driver parallelism — previously unwired (code default 8
          # was the only effective value); adopters set the repo variable
          # to throttle concurrent Implement runs (ADR-0014).
          GH_AW_ORCH_WAVE_CAP: ${{ vars.GH_AW_ORCH_WAVE_CAP }}
          # repo-agnostic adopter config: the append-only JSON registry
          # enables the mechanical findings/registry conflict auto-merge;
          # comma list of version-file suffixes (default build.gradle.kts).
          # An adopter that configures neither keeps every conflict human.
          GH_AW_REGISTRY_PATH: ${{ vars.GH_AW_REGISTRY_PATH }}
          GH_AW_REGISTRY_VERSION_FILES: ${{ vars.GH_AW_REGISTRY_VERSION_FILES }}
        run: python3 .github/orchestrator.py
