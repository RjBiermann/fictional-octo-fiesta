name: Orchestrator (mechanical conveyor — approvals, readiness, chain, surrogate)

# ADR-0017 (amended 2026-10-15): non-AI plain Actions, sibling of
# 90-sweeper. Automates mechanics; surfaces decisions as @mentions;
# humans still merge PRs by default (GH_AW_AUTO_MERGE=false).

on:
  schedule:                 # background sweep (GitHub throttles schedules under
    - cron: "*/10 * * * *"  # load; event triggers carry the chain latency)
  workflow_dispatch:
  issues:
    types: [opened, labeled]      # fresh trigger labels / new specs go instantly
  pull_request:
    types: [closed]               # chain advance immediately after a merge

permissions:
  # contents: write — 16-f6b pushes union-merge commits to resolve the
  # findings.json conflict class mechanically (checkout embeds the actions
  # token for git transport). All other mutations act as the machinery App
  # (ADR-0020) when registered, else github-actions[bot] via GITHUB_TOKEN
  # (ADR-0019).
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: orchestrator
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: conflict_watch's merge-tree needs a common base
          # between origin/main and the branch ref (shallow checkouts fail
          # "refusing to merge unrelated histories")
          fetch-depth: 0

      # ADR-0020: the machinery GitHub App replaces the retired owner PAT
      # (GH_AW_PROXY_PAT as a legacy env name — orchestrator.py consumes it
      # generically). Unset (App unregistered) degrades per ADR-0019:
      # everything runs under GITHUB_TOKEN; PAT-era extras stay manual.
      - name: Machinery App token
        id: machinery_token
        if: vars.MACHINERY_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.MACHINERY_APP_ID }}
          private-key: ${{ secrets.MACHINERY_APP_KEY }}

      - name: Run the mechanical conveyor
        env:
          GH_AW_PROXY_PAT: ${{ steps.machinery_token.outputs.token }}
          GH_AW_AUTO_MERGE: ${{ vars.GH_AW_AUTO_MERGE }}
          GH_AW_ORCH_PLAN: ${{ vars.GH_AW_ORCH_PLAN }}
          GH_AW_ORCH_TAG_OWNER: ${{ vars.GH_AW_ORCH_TAG_OWNER }}
          GH_AW_ORCH_OWNER: ${{ vars.GH_AW_ORCH_OWNER }}
          # wave driver parallelism — previously unwired (code default 8
          # was the only effective value); adopters set the repo variable
          # to throttle concurrent Implement runs (ADR-0014).
          GH_AW_ORCH_WAVE_CAP: ${{ vars.GH_AW_ORCH_WAVE_CAP }}
          # repo-agnostic adopter config: the append-only JSON registry
          # enables the mechanical findings/registry conflict auto-merge;
          # comma list of version-file suffixes (default build.gradle.kts).
          # An adopter that configures neither keeps every conflict human.
          GH_AW_REGISTRY_PATH: ${{ vars.GH_AW_REGISTRY_PATH }}
          GH_AW_REGISTRY_VERSION_FILES: ${{ vars.GH_AW_REGISTRY_VERSION_FILES }}
        run: python3 .github/orchestrator.py
