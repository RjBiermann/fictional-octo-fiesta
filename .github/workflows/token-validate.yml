name: Machinery token format validation (one-shot)

# Changelog 2026-05-15: GitHub App installation tokens switch to a
# stateless ghs_ JWT format (~520 chars). Per the recommended procedure:
# mint both formats via the per-request override header, prove each
# works end-to-end against the real API, record shapes. Run once, then
# delete this workflow.

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Mint + probe both token formats
        env:
          APP_KEY: ${{ secrets.MACHINERY_APP_KEY }}
          CLIENT_ID: ${{ vars.MACHINERY_APP_CLIENT_ID }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$APP_KEY" > key.pem
          # App JWT (RS256, openssl) — authenticates the mint endpoint
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          payload=$(printf '{"iss":%s,"iat":%d,"exp":%d}' "\"$CLIENT_ID\"" "$now" $((now + 540)) | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign key.pem -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          JWT="$header.$payload.$sig"

          # discover the installation id
          INSTALL_ID=$(curl -s -H "Authorization: Bearer $JWT" \
            https://api.github.com/app/installations | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')
          echo "installation: $INSTALL_ID"

          for MODE in enabled disabled; do
            RESP=$(curl -s -X POST -H "Authorization: Bearer $JWT" \
              -H "X-GitHub-Stateless-S2S-Token: $MODE" \
              "https://api.github.com/app/installations/$INSTALL_ID/access_tokens")
            TOKEN=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            LEN=${#TOKEN}; DOTS=$(printf '%s' "$TOKEN" | tr -cd . | wc -c)
            echo "$MODE: len=$LEN dots=$DOTS prefix=${TOKEN:0:4}"
            # end-to-end: real authenticated API calls with the minted token (curl — no gh auth dependency)
            curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$REPO" | python3 -c 'import json,sys; print("probe1:", json.load(sys.stdin)["full_name"])'
            curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$REPO/issues?per_page=1" | python3 -c 'import json,sys; print("probe2: issue", json.load(sys.stdin)[0]["number"])'
            echo "$MODE: OK"
          done
          echo "VALIDATION PASSED — both formats serve real API calls"
