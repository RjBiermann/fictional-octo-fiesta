name: zz-free-models-dryrun (disposable)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Z.ai auth + free completion
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/z.json -w '%{http_code}' -X POST \
            https://api.z.ai/api/paas/v4/chat/completions \
            -H "Authorization: Bearer $ZAI_API_KEY" -H 'Content-Type: application/json' \
            -d '{"model":"glm-4.5-flash","max_tokens":8,"messages":[{"role":"user","content":"say OK"}]}')
          echo "zai HTTP: $code"; head -c 300 /tmp/z.json; echo
          test "$code" = 200 && grep -q '"choices"' /tmp/z.json
      - name: OpenRouter free completion (optional)
        if: ${{ secrets.OPENROUTER_API_KEY != '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/o.json -w '%{http_code}' -X POST \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" -H 'Content-Type: application/json' \
            -d '{"model":"meta-llama/llama-3.3-70b-instruct:free","max_tokens":8,"messages":[{"role":"user","content":"say OK"}]}')
          echo "openrouter HTTP: $code"; head -c 300 /tmp/o.json; echo
