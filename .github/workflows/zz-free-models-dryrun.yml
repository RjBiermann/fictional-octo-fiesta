name: zz-free-models-dryrun (disposable)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: OpenRouter free completion re-check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/o.json -w '%{http_code}' -X POST \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" -H 'Content-Type: application/json' \
            -d '{"model":"nvidia/nemotron-3.5-lightning:free","max_tokens":8,"messages":[{"role":"user","content":"say OK"}]}')
          echo "openrouter HTTP: $code"
          cat /tmp/o.json
