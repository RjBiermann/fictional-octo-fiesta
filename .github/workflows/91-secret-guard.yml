name: 91-secret-guard
# Non-AI mechanical guard (ADR-0007 lane review, 2026-10): threat-detection
# is disabled on the pi engine lane (shared/engine-lane.md), so nothing
# scans agent posts for leaked credentials before they land. This workflow
# redacts credential-shaped strings from BOT-authored comments and issue
# bodies after the fact and keeps one open notification issue.
# Humans' content is never touched. Known limit: posts made through an
# owner PAT (GH_AW_PROXY_PAT) are indistinguishable from the human —
# out of scope; the agent lane uses GITHUB_TOKEN (github-actions[bot]).
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  # review-comment redaction (PATCH pulls/comments/{id}) needs this
  pull-requests: write

concurrency:
  group: secret-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Redact credential-shaped strings in bot content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BOT: github-actions[bot]
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.comment.user.login || github.event.issue.user.login }}
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess

          repo, bot = os.environ["REPO"], os.environ["BOT"]
          author = os.environ["AUTHOR"]
          ev, action = os.environ["EVENT"], os.environ["ACTION"]
          gh = lambda *a: subprocess.run(["gh", *a], capture_output=True, text=True)
          ev_json = json.load(open(os.environ["GITHUB_EVENT_PATH"]))

          if ev == "issue_comment":
              body, ep = ev_json["comment"]["body"], f"issues/comments/{ev_json['comment']['id']}"
          elif ev == "pull_request_review_comment":
              body, ep = ev_json["comment"]["body"], f"pulls/comments/{ev_json['comment']['id']}"
          else:  # issues opened/edited
              body, ep = ev_json["issue"]["body"] or "", f"issues/{ev_json['issue']['number']}"

          # Machine-authored = bot identity, or the orchestrator's marker:
          # the conveyor posts as the OWNER (GH_AW_PROXY_PAT — gh-aw's
          # activation gate rejects bot-actor events, and GITHUB_TOKEN
          # events don't fire workflows at all), so its comments quote
          # repo-controlled text (titles, decision tags) under a human
          # identity. Marker-bearing content is mechanical, never human.
          if author != bot and "[orchestrator]" not in body:
              raise SystemExit(0)  # never touch human content

          patterns = {
              "github-app-token": r"gh[posur]_[A-Za-z0-9]{30,}",
              "github-pat": r"github_pat_[A-Za-z0-9_]{20,}",
              "openai-style-key": r"sk-[A-Za-z0-9_-]{20,}",
              "aws-access-key": r"AKIA[0-9A-Z]{16}",
              "slack-token": r"xox[baprs]-[A-Za-z0-9-]{10,}",
              "google-api-key": r"AIza[0-9A-Za-z_\-]{35}",
          }
          hits = sorted(n for n, p in patterns.items() if re.search(p, body))
          if not hits:
              raise SystemExit(0)

          redacted = body
          for p in patterns.values():
              redacted = re.sub(p, "[REDACTED by secret-guard]", redacted)
          r = gh("api", "-X", "PATCH", f"repos/{repo}/{ep}",
                 "-f", f"body={redacted}")
          if r.returncode != 0:
              raise SystemExit(f"redact failed: {r.stderr[:200]}")

          # One rolling notification issue: comment on the open one, else create.
          q = gh("issue", "list", "--repo", repo, "--state", "open",
                 "--search", "[secret-guard] in:title", "--json", "number")
          open_issues = json.loads(q.stdout) if q.returncode == 0 else []
          note = (f"Redacted {', '.join(hits)} in {ep} "
                  f"(author {author}, {action}); content replaced, evidence never copied here.")
          if open_issues:
              gh("issue", "comment", str(open_issues[0]["number"]), "--repo", repo, "--body", note)
          else:
              gh("issue", "create", "--repo", repo,
                 "--title", f"[secret-guard] redacted bot content {__import__('datetime').date.today()}",
                 "--body", note)
          EOF
