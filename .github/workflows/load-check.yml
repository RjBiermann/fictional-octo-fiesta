name: Load check

# ADR-0012 — scheduled fleet-wide compile + emulator load check.
# Zero AI steps: bootstrap, compile, emulator, logcat grep are pure bash/Gradle/adb.
# A failing plugin set opens ONE issue (dedup key = sorted failing-plugin list,
# see .github/load-check/) with a mechanical `ai-fix` label (ADR-0006). The
# labels are display state (ADR-0019: GITHUB_TOKEN label events fire nothing);
# the fire is the orchestrator's `_fire_implement` relay shape — stamp
# status/planned + workflow_dispatch of 05-implement (dispatch always
# creates a run). Emulator results are never Geo-gated evidence (same
# runner IP).

on:
  schedule:
    # Off the top of the hour so the Gradle build never collides with the
    # build.yml cron; queued, never cancelled mid-emulator.
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      comment_on:
        description: "Issue/PR number to post the lane digest to (empty = step summary only)"
        required: false
        default: ""

concurrency:
  group: load-check
  cancel-in-progress: false

permissions:
  # ADR-0012: failure-report path needs issues: write (failure-issue.sh
  # creates/comments/closes; Fire Implement re-labels) and actions: write
  # (gh workflow run 05-implement relay — ADR-0019/0020). contents: read
  # covers the checkout fetch + gradle.
  contents: read
  issues: write
  # `comment_on` is usually a PR, and commenting there needs this scope even though the call
  # is `gh issue comment` (measured: without it the digest step dies on
  # "GraphQL: Resource not accessible by integration (addComment)" — run 40777014725).
  pull-requests: write
  actions: write

jobs:
  # Story C of the #787 leak class (parent #796, spec #894): the guard that
  # stops one story's repair from carrying another story's deliverables is
  # prompt text, so it needs a mechanical assertion. Static prompt check on
  # Rule 0 (07-fix-loop + 14-rebase) plus the scripted dispatch sim in
  # .github/sims/. Zero AI, stdlib Python, no network — a load-check
  # extension, not part of the emulator lane.
  pipeline-sims:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cross-contamination sim + prompt assertion (#894, parent #796)
        run: python3 .github/sims/cross_contamination_sim.py -v

      # The load check's own parser is load-bearing (it spent 18 rounds being debugged), so its
      # fixture self-check runs in the zero-AI lane (ADR-0005: tests run where the code runs).
      - name: load-check log parser self-check
        run: bash .github/load-check/scripts/test-parse.sh

  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Step 1 of ADR-0012: fetch the LIVE, UNPINNED pre-release classes.jar.
      # This is the point of the check — it also catches upstream jar refreshes
      # that never touch any of our commits.
      - name: Bootstrap cloudstream3 pre-release jar
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew bootstrapCloudstream
          JAR=$(find ~/.m2/repository/com/lagradost/cloudstream3/pre-release -name 'classes*.jar' | head -1)
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          {
            echo "jar_sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "$SHA" > jar-sha.txt

      # Step 2: compile all providers against it. --continue so one broken
      # provider still reports the others; failures are parsed from the log.
      - name: Compile all providers
        run: |
          chmod +x gradlew
          ./gradlew make --continue 2>&1 | tee compile.log
          test "${PIPESTATUS[0]}" -eq 0
        # makePluginsJson artifacts (repo.json/plugins.json) are NOT produced
        # here — the emulator loads local plugins directly (upstream's
        # deployWithAdb mechanism), no repo server involved.
      - name: Stage .cs3 files
        run: |
          mkdir -p cs3
          cp -- */build/*.cs3 cs3/
          ls -la cs3

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-check
          path: |
            cs3/
            jar-sha.txt
            compile.log
          if-no-files-found: warn

      - name: Failure issue (compile)
        id: failure_compile
        if: failure()
        env:
          # ADR-0020: plain GITHUB_TOKEN — the labels are display state; the
          # Fire Implement step below is the fire.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: compile
          JAR_SHA: ${{ steps.bootstrap.outputs.jar_sha }}
        run: |
          ./.github/load-check/scripts/failure-issue.sh \
            --plugins <( { sed -n 's/> Task :\([A-Za-z0-9]*\):make FAILED/\1/p' compile.log | sort -u; } > failing-plugins.txt; \
              [[ -s failing-plugins.txt ]] || { \
                echo 'unknown-attribution (root-level failure: no per-provider FAILED task line)' > failing-plugins.txt; }; \
              cat failing-plugins.txt ) \
            --log compile.log

      - name: Fire Implement (ADR-0020 — dispatch is the fire, labels are state)
        if: failure() && steps.failure_compile.outcome == 'success' && steps.failure_compile.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.failure_compile.outputs.issue }}
        run: |
          gh issue edit "$ISSUE" --add-label status/planned
          ctx=$(jq -cn --argjson n "$ISSUE" '{item_type:"issue",item_number:$n}')
          gh workflow run 05-implement.lock.yml --ref main -f "aw_context=$ctx"

  load:
    needs: compile
    runs-on: ubuntu-latest
    # Above the sum of the step ceilings (20 + 25 + 6 + digest/upload), so a slow run trips a
    # step and still uploads diagnostics, digest and artifact.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: load-check
          path: artifact

      # The emulator job has no Android SDK of its own: the compile job gets one from
      # setup-android, this job must too (without it `sdkmanager`/`avdmanager` are not on
      # PATH and every run died at AVD creation: "sdkmanager: command not found").
      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Step 3: KVM emulator on the ubuntu runner, load every plugin in one boot.
      - name: Setup emulator
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq ffmpeg
          # GitHub-hosted runners expose /dev/kvm but the runner user is not in the kvm group,
          # so the emulator refuses to start ("this user doesn't have permissions to use KVM").
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "platform-tools" "build-tools;35.0.0" \
            "system-images;android-34;google_apis;x86_64" > /dev/null
          echo no | avdmanager create avd -n loadcheck -k "system-images;android-34;google_apis;x86_64" -d pixel
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Fail here, with the reason, instead of burning the 15-minute boot window.
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Start emulator
        run: |
          mkdir -p loadcheck-evidence
          # `-gpu auto` on a hosted runner resolves to swangle (software ANGLE), the only mode
          # observed to survive rendered video: `swiftshader_indirect` aborts the emulator on the
          # first frame, and `angle_indirect` is not a valid option for this build.
          $ANDROID_HOME/emulator/emulator -avd loadcheck -no-window -no-audio \
            -no-boot-anim -gpu auto -no-snapshot \
            > loadcheck-evidence/emulator.log 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"

      - name: Run load check
        id: check
        timeout-minutes: 25
        env:
          # emulator-load.sh resolves the prerelease APK with `gh api`; without the token it
          # exits 4 before installing the app (the emulator has already booted by then).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/load-check/scripts/emulator-load.sh artifact/cs3

      # ADR-0012 tier 2: the app's own player, on a site-free fixture. This is the only check
      # that observes the datasource where a non-http source dies as 2001 (#1353).
      - name: Player path probe
        id: player_probe
        if: always()
        timeout-minutes: 6
        run: |
          ./.github/load-check/scripts/player-probe.sh loadcheck-evidence

      # Why did the emulator die? One cheap snapshot, taken only when the job is already red.
      - name: Emulator diagnostics
        if: failure()
        run: |
          mkdir -p loadcheck-evidence
          {
            echo "## date"; date -u
            echo "## memory"; free -h
            echo "## emulator process"; ps -eo pid,rss,etime,cmd | grep -i "qemu-system" | grep -v grep || echo "no emulator process"
            echo "## kernel log (oom / segv)"; sudo dmesg --ctime 2>/dev/null | tail -60 || echo "dmesg not readable"
          } > loadcheck-evidence/diagnostics.txt 2>&1 || true

      # One screen of verdict in the run summary, and a comment on the issue/PR that asked.
      - name: Lane digest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOAD: ${{ steps.check.outcome }}
          PROBE: ${{ steps.player_probe.outcome }}
          COMMENT_ON: ${{ inputs.comment_on }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.github/load-check/scripts/lane-digest.sh loadcheck-evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-check-logcat
          path: loadcheck-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Failure issue (load)
        id: failure_load
        if: failure()
        env:
          LOAD: ${{ steps.check.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: load
        run: |
          # A probe-only failure has nothing to attribute: the load check passed and no plugin
          # failed. A boot/SDK/install failure is still reported (that is #1357's unattributable
          # class) — but through `unattributable.txt`, which the writer files for a human, so no
          # implementation run is dispatched for it.
          if [[ ${LOAD:-} == success && ! -s loadcheck-evidence/failing-plugins.txt ]]; then
            echo "load check passed, no failing plugin set — probe/scenario fault, nothing for the issue writer"
            exit 0
          fi
          unattributable=()
          if [[ ! -s loadcheck-evidence/failing-plugins.txt ]]; then
            # Boot/SDK/install failed, so nothing was attributed (#1357's unattributable class).
            echo "load step reported ${LOAD:-unknown} with no plugin named" \
              >> loadcheck-evidence/unattributable.txt
          fi
          if [[ -s loadcheck-evidence/unattributable.txt ]]; then
            # Report it, but never as `ai-fix`: that label dispatches 05-implement, and an
            # implementation run cannot repair a runner. The writer labels it for a human.
            echo "unattributable" > loadcheck-evidence/failing-plugins.txt
            unattributable=(--unattributable)
          fi
          # Separate assignment from export: exporting in the same statement
          # masks the command substitution's return status (actionlint SC2155).
          JAR_SHA=$(cat artifact/jar-sha.txt 2>/dev/null || echo unknown)
          export JAR_SHA
          ./.github/load-check/scripts/failure-issue.sh "${unattributable[@]}" \
            --plugins <(sort -u loadcheck-evidence/failing-plugins.txt) \
            --log loadcheck-evidence/logcat.log \
            --version loadcheck-evidence/app-version.txt

      - name: Fire Implement (ADR-0020 — dispatch is the fire, labels are state)
        if: failure() && steps.failure_load.outcome == 'success' && steps.failure_load.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.failure_load.outputs.issue }}
        run: |
          gh issue edit "$ISSUE" --add-label status/planned
          ctx=$(jq -cn --argjson n "$ISSUE" '{item_type:"issue",item_number:$n}')
          gh workflow run 05-implement.lock.yml --ref main -f "aw_context=$ctx"
