name: Version bump

# PR-time provider version bumps (issue #921, epic #910).
#
# A provider's `version` in build.gradle.kts stops being a manual edit: every PR that
# changes a provider (or `shared/**` / the root Gradle inputs, which splice into all of
# them — ADR-0002) gets its affected providers' integer `version` incremented and
# committed onto the PR's own branch.
#
# This workflow is a writer and nothing else: it never merges, never approves, never
# labels. Fork PRs are out of scope — there is no branch in this repository to push to.
#
# Why the machinery App token: a GITHUB_TOKEN push creates no workflow runs, so the bump
# commit would carry no checks and the PR would sit BLOCKED on its now-stale required
# status checks. The App-authenticated push re-triggers CI on the new head — which is why
# the loop guard (commit marker + note scan) must hold against an App push too, not just
# against GITHUB_TOKEN's no-retrigger behaviour.
on:
  pull_request:
    types: [opened, synchronize]

# Serial per PR, never cancel-in-progress: a run cancelled mid-push loses the bump
# commit it just made, and two runs racing the same branch is how a real bump is lost.
concurrency:
  group: version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write        # push the bump commit back to the PR branch
  pull-requests: read

jobs:
  bump:
    # Fork PRs are out of scope (spec boundary): the head branch lives in another
    # repository, so there is nothing here this workflow may push a bump to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # ADR-0020: the App is optional. Unset (App unregistered) falls through to
      # GITHUB_TOKEN, which still pushes — only the CI re-trigger on the bump commit is
      # lost, and the PR then needs a rebase/human nudge before its checks are current.
      - name: Mint machinery App token
        id: app
        if: vars.MACHINERY_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.MACHINERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.MACHINERY_APP_KEY }}

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The classifier diffs base..head, so the base commit must be readable
          # locally; a shallow clone would turn the classification into a guess.
          fetch-depth: 0
          # App token when minted (its push re-triggers CI on the bump commit, see the
          # header), GITHUB_TOKEN otherwise — same credential for checkout and push.
          token: ${{ steps.app.outputs.token || github.token }}
          persist-credentials: true

      # Loop guard, part 1 of 2 (see the bump step for the marker scan).
      - name: Loop guard
        id: guard
        run: |
          # GITHUB_TOKEN pushes do not start workflow runs, but a machinery-App
          # authenticated push does — so the guard cannot lean on GitHub's token
          # semantics. Our own bump commit says so in its message; any re-triggered
          # run stops here instead of bumping a second time.
          if git log -1 --format=%B | grep -qF '[skip version-bump]'; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "version-bump: head commit is a bump commit — nothing to do"
            exit 0
          fi
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Classify affected providers
        id: affected
        if: steps.guard.outputs.bump == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # One classification contract, shared with the build gate (#919):
          # none | <Provider> lines | ALL, where ALL means every provider because a
          # shared/** or root Gradle change reaches all of them (ADR-0002).
          # Three-dot: classify the PR's own changes (merge-base..head), never the
          # main-side commits the branch happens to be behind — a two-dot diff would
          # report those as changes and bump providers this PR never touched.
          if [[ ! -f scripts/affected-set.sh ]]; then
            # A branch cut before the classifier landed carries no affected-set.sh. No
            # classification → no write (fail closed): warn and skip instead of red-ing
            # every old branch or guessing ALL (26 spurious bumps).
            echo "::warning::scripts/affected-set.sh absent on this branch — skipping the bump"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! classified=$(bash scripts/affected-set.sh --diff "$BASE_SHA...$HEAD_SHA"); then
            # An unclassifiable PR writes nothing (fail closed). Falling back to ALL
            # would bump all 26 providers for a change we could not attribute.
            echo "::error::affected-set.sh could not classify $BASE_SHA...$HEAD_SHA"
            exit 1
          fi
          echo "version-bump: affected set [$(printf '%s' "$classified" | tr '\n' ' ')]"
          echo "run=true" >> "$GITHUB_OUTPUT"
          {
            echo "set<<AFFECTED_SET_EOF"
            printf '%s\n' "$classified"
            echo "AFFECTED_SET_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump affected providers
        id: bump
        if: steps.guard.outputs.bump == 'true' && steps.affected.outputs.run == 'true'
        env:
          AFFECTED: ${{ steps.affected.outputs.set }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The note is the repo's existing `// #<issue>: <what changed>` style, and it
          # doubles as loop guard part 2 of 2: the bumper leaves a build file that
          # already carries this note untouched, so a re-triggered or re-run session
          # cannot double-bump even if the commit marker was lost.
          note="#${PR_NUMBER}: version bump"
          changed=$(printf '%s\n' "$AFFECTED" | bash scripts/bump-provider-versions.sh --note "$note")
          if [[ -z $changed ]]; then
            # `none` — a PR touching only docs, scripts, audits or non-build workflows
            # — and an already-bumped PR both land here: no commit, exit clean.
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "version-bump: no provider version to move — no commit"
            exit 0
          fi
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          printf 'version-bump: bumped\n%s\n' "$changed"

      - name: Commit and push the bump
        if: steps.bump.outputs.bumped == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u
          staged=$(git diff --cached --name-only)
          if [[ -z $staged ]]; then
            echo "version-bump: nothing staged — no commit"
            exit 0
          fi
          # The bump commit must carry provider build files and nothing else: any other
          # staged path means this workflow touched something it never should.
          unexpected=$(printf '%s\n' "$staged" | grep -vE '^[^/]+/build\.gradle\.kts$' || true)
          if [[ -n $unexpected ]]; then
            echo "::error::refusing to commit unexpected paths"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git commit -m "chore(version): bump affected providers (#${PR_NUMBER}) [skip version-bump]"
          # Same-repo PR branch only (the job-level `if` already excluded forks).
          git push origin "HEAD:${HEAD_REF}"
