name: zz-agent-auth-dryrun (disposable)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: opencode-go auth + model smoke
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            https://opencode.ai/zen/go/v1/models)
          echo "models list HTTP: $code"; head -c 200 /tmp/models.json; echo
          test "$code" = 200
          grep -q glm-5.3-flash /tmp/models.json
          curl -s -X POST https://opencode.ai/zen/go/v1/chat/completions \
            -H "Authorization: Bearer $OPENCODE_API_KEY" -H 'Content-Type: application/json' \
            -d '{"model":"glm-5.3-flash","max_tokens":8,"messages":[{"role":"user","content":"say OK"}]}' \
            | tee /tmp/comp.json | head -c 300; echo
          grep -q '"choices"' /tmp/comp.json
      - name: rtk binary install + run
        run: |
          curl -sL -o /tmp/rtk.tgz \
            https://github.com/rtk-ai/rtk/releases/latest/download/rtk-x86_64-unknown-linux-musl.tar.gz
          mkdir /tmp/rtkx && tar -xzf /tmp/rtk.tgz -C /tmp/rtkx
          RTK_BIN=$(find /tmp/rtkx -name rtk -type f | head -1)
          echo "rtk binary: $RTK_BIN"
          "$RTK_BIN" --version
