name: AI build (issue → agent → PR)

# Builder pipeline: a maintainer labels an issue ai-fix / ai-new-site; the Builder
# agent (pi, free models) probes the live site, builds or fixes the provider,
# verifies against the site, and opens a PR. Humans merge. See spec issue #1.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-agent
  cancel-in-progress: false

jobs:
  build:
    # fires on every label event; no-op unless it's a trigger label
    if: github.event.label.name == 'ai-fix' || github.event.label.name == 'ai-new-site'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install agent runtime (pi, ponytail, caveman, rtk)
        run: |
          npm i -g @earendil-works/pi-coding-agent >/dev/null 2>&1
          npm i -g @dietrichgebert/ponytail >/dev/null 2>&1
          npm i -g @caveman-ai/cli >/dev/null 2>&1
          pi install npm:@dietrichgebert/ponytail >/dev/null
          # rtk: static binary, token-savings bash rewrites (needs >= 0.23)
          curl -sL -o /tmp/rtk.tgz \
            https://github.com/rtk-ai/rtk/releases/latest/download/rtk-x86_64-unknown-linux-musl.tar.gz
          mkdir /tmp/rtkx && tar -xzf /tmp/rtk.tgz -C /tmp/rtkx
          install -m755 "$(find /tmp/rtkx -name rtk -type f | head -1)" /usr/local/bin/rtk
          rtk --version

      - name: Model config (free tiers only)
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json <<'JSON'
          {
            "providers": {
              "zai-free": {
                "baseUrl": "https://api.z.ai/api/paas/v4",
                "api": "openai-completions",
                "apiKey": "$ZAI_API_KEY",
                "compat": { "thinkingFormat": "zai" },
                "models": [
                  { "id": "glm-4.5-flash", "name": "GLM 4.5 Flash (free)", "reasoning": true }
                ]
              },
              "openrouter-free": {
                "baseUrl": "https://openrouter.ai/api/v1",
                "api": "openai-completions",
                "apiKey": "$OPENROUTER_API_KEY",
                "compat": { "thinkingFormat": "openrouter" },
                "models": [
                  { "id": "nvidia/nemotron-3.5-lightning:free", "name": "Nemotron Lightning (free)", "reasoning": true }
                ]
              }
            }
          }
          JSON

      - name: Compose builder prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          gh issue view "$n" --json number,title,body -q '"# Issue #\(.number) — \(.title)\n\n\(.body)"' > /tmp/issue.md
          kind="${{ github.event.label.name }}"
          {
            echo "You are the Builder in this repo's AI pipeline."
            if [[ "$kind" == "ai-fix" ]]; then
              echo "Task: FIX a broken existing provider per the issue below."
            else
              echo "Task: BUILD a new provider per the issue below."
            fi
            cat /tmp/issue.md
            echo "Deliverables: branch ai/issue-$n, commit, push, then gh pr create with a"
            echo "body starting 'Fixes #$n' followed by: what you found (FINDINGS summary),"
            echo "verification/Blocked evidence. Nothing else on the tracker."
            cat .pi/ci/builder-rules.md
          } > /tmp/prompt.md
          wc -c /tmp/prompt.md

      - name: Builder run (Z.ai glm-4.5-flash)
        id: run1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pi --no-session --mode text \
            --model zai-free/glm-4.5-flash --thinking low \
            --skill .pi/skills/site-probe \
            --skill .pi/skills/new-provider \
            --skill .pi/skills/fix-provider \
            --skill .pi/skills/verify-provider \
            -e .pi/ci/extensions/rtk.ts \
            -e .pi/ci/extensions/caveman-native.js \
            -p "$(cat /tmp/prompt.md)"

      - name: Builder run (OpenRouter free fallback)
        id: run2
        if: steps.run1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pi --no-session --mode text \
            --model openrouter-free/nvidia/nemotron-3.5-lightning:free --thinking low \
            --skill .pi/skills/site-probe \
            --skill .pi/skills/new-provider \
            --skill .pi/skills/fix-provider \
            --skill .pi/skills/verify-provider \
            -e .pi/ci/extensions/rtk.ts \
            -e .pi/ci/extensions/caveman-native.js \
            -p "$(cat /tmp/prompt.md)"

      - name: Gate
        if: always()
        run: |
          if [[ "${{ steps.run1.outcome }}" == "success" || "${{ steps.run2.outcome }}" == "success" ]]; then
            echo "builder completed"; exit 0
          fi
          echo "both model attempts failed"
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Builder failed on both free models (Z.ai + OpenRouter fallback). Issue stays open for manual handling. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
