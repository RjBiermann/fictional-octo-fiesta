name: AI build (issue → agent → PR)

# Builder pipeline: a maintainer labels an issue ai-fix / ai-new-site /
# ai-remove-site; the Builder agent (pi, OpenCode Go: GLM → DeepSeek) probes
# the live site, builds, fixes, or removes the provider, verifies against the
# site, and opens a PR. Humans merge. See spec issue #1.
# Re-fire: comment /retry on the issue (or its PR) — dispatches this workflow
# (workflow_dispatch), superseding any run in flight.

on:
  issues:
    types: [labeled]
  # /retry re-fires this via `gh workflow run` — GITHUB_TOKEN label events
  # never trigger workflows (see ADR-0003), so dispatch is the only reliable path
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to build (must carry a trigger label)
        required: true
        type: string
      kind:
        description: Trigger label (ai-fix / ai-new-site / ai-remove-site)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-build-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    # fires on every label event and on /retry dispatch; no-op unless a trigger label applies
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ai-fix' ||
      github.event.label.name == 'ai-new-site' ||
      github.event.label.name == 'ai-remove-site'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/agent-runtime

      - name: Compose builder prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ env.ISSUE }}"
          gh issue view "$n" --json number,title,body -q '"# Issue #\(.number) — \(.title)\n\n\(.body)"' > /tmp/issue.md
          echo "COMMENTS_BEFORE=$(gh issue view "$n" --json comments -q '.comments|length')" >> "$GITHUB_ENV"
          kind="${{ github.event.label.name || inputs.kind }}"
          {
            echo "You are the Builder in this repo's AI pipeline."
            if [[ "$kind" == "ai-fix" ]]; then
              echo "Task: FIX a broken existing provider per the issue below."
            elif [[ "$kind" == "ai-remove-site" ]]; then
              echo "Task: REMOVE an existing provider per the issue below."
              echo "The maintainer's ai-remove-site label IS the decision — probe the"
              echo "site for evidence only (no FINDINGS.md), then delete and open the"
              echo "removal PR per the remove-provider skill. Do NOT stop because the"
              echo "site still works; the maintainer already decided."
            else
              echo "Task: BUILD a new provider per the issue below."
            fi
            cat /tmp/issue.md
            echo "Deliverables: leave your changes UNCOMMITTED in the working tree and"
            echo "write the PR body to /tmp/pr-body.md — starting 'Fixes #$n' followed by:"
            echo "what you found (FINDINGS summary), verification/Blocked evidence."
            echo "The workflow creates the branch, push, and PR mechanically after your"
            echo "run — do NOT attempt git push or gh pr create yourself."
            echo "Nothing else on the tracker (progress comments per the observability rule are fine)."
            cat .pi/ci/builder-rules.md
          } > /tmp/prompt.md
          wc -c /tmp/prompt.md

      # Mechanical narration floor (CONTEXT.md: Ack). The prompt asks the agent for
      # progress comments; the Ack is guaranteed by machinery. The Gate measures agent
      # narration beyond it — softly (warning, never verdict-flipping; CONTEXT.md: Gate).
      - name: Ack (mechanical narration floor)
        if: always()
        run: |
          gh issue comment "${{ env.ISSUE }}" \
            --body "Builder picked up issue #${{ env.ISSUE }} — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Progress comments follow as work completes."
        env:
          GH_TOKEN: ${{ github.token }}

      # Shared Agent run module (.github/actions/agent-run): primary → fallback
      # pair, bounded retries, prompt over stdin (never argv — E2BIG). Verdict via
      # steps.agent.outputs.outcome.
      - name: Builder run (Go glm-5.3-flash → deepseek-v4-flash fallback)
        id: agent
        uses: ./.github/actions/agent-run
        with:
          prompt: /tmp/prompt.md
          skills: .pi/skills/site-probe .pi/skills/new-provider .pi/skills/fix-provider .pi/skills/verify-provider .pi/skills/remove-provider
          thinking: low
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      # Insurance against delivery failure: a model run that died at push
      # must not cost a full /retry re-run. Maintainer delivers the artifact
      # by hand instead (see ADR-0004).
      - name: Preserve tree (delivery-failure insurance)
        if: steps.agent.outputs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tree-issue-${{ env.ISSUE }}
          path: .
          retention-days: 7

      - name: Deliver branch + PR (mechanical)
        id: deliver
        if: steps.agent.outputs.outcome == 'success'
        uses: ./.github/actions/deliver-pr
        with:
          issue: ${{ env.ISSUE }}
          token: ${{ secrets.AGENT_PAT || github.token }}

      - name: Gate
        if: always()
        run: |
          n="${{ env.ISSUE }}"
          if [[ "${{ steps.agent.outputs.outcome }}" == "success" ]]; then
            if [[ "${{ steps.deliver.outcome }}" != "success" ]]; then
              echo "agent run succeeded but branch/PR delivery failed"
              gh issue comment "$n" --body "Builder produced no deliverable — delivery failed, but its working tree is preserved as artifact \`tree-issue-$n\` on run ${{ github.run_id }}. Deliver manually (\`gh run download ${{ github.run_id }} -n tree-issue-$n\`, commit, push \`ai/issue-$n\` with AGENT_PAT, open the PR) instead of /retry-ing a full model re-run. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              exit 1
            fi
            # Gate (CONTEXT.md): delivery is the verdict; narration violations are
            # loud warnings only. Baseline = COMMENTS_BEFORE + 1 (the mechanical Ack).
            after=$(gh issue view "$n" --json comments -q '.comments|length' || echo 0)
            if [[ "${after:-0}" -le $((COMMENTS_BEFORE + 1)) ]]; then
              echo "agent posted no comments beyond the mechanical ack — observability warning"
              gh issue comment "$n" --body "⚠️ Observability warning (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}): the run succeeded and its deliverable landed, but the agent posted no progress comments of its own. A mid-run death would have left nothing on the tracker. Not a failure — logged for visibility."
            fi
            echo "builder delivered branch + PR"; exit 0
          fi
          echo "both model attempts failed (GLM + DeepSeek)"
          gh issue comment "${{ env.ISSUE }}" \
            --body "Builder failed on both Go models (GLM → DeepSeek). Issue stays open for manual handling. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
