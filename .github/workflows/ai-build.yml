name: AI build (issue → agent → PR)

# Builder pipeline: a maintainer labels an issue ai-fix / ai-new-site /
# ai-remove-site; the Builder agent (pi, free models) probes the live site,
# builds, fixes, or removes the provider, verifies against the site, and opens
# a PR. Humans merge. See spec issue #1.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-build-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    # fires on every label event; no-op unless it's a trigger label
    if: github.event.label.name == 'ai-fix' || github.event.label.name == 'ai-new-site' || github.event.label.name == 'ai-remove-site'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/agent-runtime

      - name: Compose builder prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          gh issue view "$n" --json number,title,body -q '"# Issue #\(.number) — \(.title)\n\n\(.body)"' > /tmp/issue.md
          kind="${{ github.event.label.name }}"
          {
            echo "You are the Builder in this repo's AI pipeline."
            if [[ "$kind" == "ai-fix" ]]; then
              echo "Task: FIX a broken existing provider per the issue below."
            elif [[ "$kind" == "ai-remove-site" ]]; then
              echo "Task: REMOVE an existing provider per the issue below."
              echo "The maintainer's ai-remove-site label IS the decision — probe the"
              echo "site for evidence only (no FINDINGS.md), then delete and open the"
              echo "removal PR per the remove-provider skill. Do NOT stop because the"
              echo "site still works; the maintainer already decided."
            else
              echo "Task: BUILD a new provider per the issue below."
            fi
            cat /tmp/issue.md
            echo "Deliverables: leave your changes UNCOMMITTED in the working tree and"
            echo "write the PR body to /tmp/pr-body.md — starting 'Fixes #$n' followed by:"
            echo "what you found (FINDINGS summary), verification/Blocked evidence."
            echo "The workflow creates the branch, push, and PR mechanically after your"
            echo "run — do NOT attempt git push or gh pr create yourself."
            echo "Nothing else on the tracker."
            cat .pi/ci/builder-rules.md
          } > /tmp/prompt.md
          wc -c /tmp/prompt.md

      - name: Builder run (Z.ai glm-4.5-flash)
        id: run1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pi --no-session --mode text \
            --model zai-free/glm-4.5-flash --thinking low \
            --skill .pi/skills/site-probe \
            --skill .pi/skills/new-provider \
            --skill .pi/skills/fix-provider \
            --skill .pi/skills/verify-provider \
            --skill .pi/skills/remove-provider \
            -e .pi/ci/extensions/rtk.ts \
            -p "$(cat /tmp/prompt.md)"

      - name: Builder run (OpenRouter free fallback)
        id: run2
        if: steps.run1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pi --no-session --mode text \
            --model openrouter-free/nvidia/nemotron-3.5-lightning:free --thinking low \
            --skill .pi/skills/site-probe \
            --skill .pi/skills/new-provider \
            --skill .pi/skills/fix-provider \
            --skill .pi/skills/verify-provider \
            --skill .pi/skills/remove-provider \
            -e .pi/ci/extensions/rtk.ts \
            -p "$(cat /tmp/prompt.md)"

      - name: Deliver branch + PR (mechanical)
        id: deliver
        if: steps.run1.outcome == 'success' || steps.run2.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ github.event.issue.number }}"
          if [[ "$(gh pr list --head "ai/issue-$n" --json number -q 'length')" != "0" ]]; then
            echo "PR already exists — agent did it itself"; exit 0
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Builder: resolve #$n"
          fi
          git rev-parse -q --verify "ai/issue-$n" >/dev/null || git branch "ai/issue-$n"
          git push -q --force origin "ai/issue-$n"
          title=$(gh issue view "$n" --json title -q .title)
          body=/tmp/pr-body.md
          if [[ ! -f $body ]]; then
            printf 'Fixes #%s\n' "$n" > /tmp/pr-body-default.md
            body=/tmp/pr-body-default.md
          fi
          gh pr create --head "ai/issue-$n" --base main --title "$title" --body-file "$body"

      - name: Gate
        if: always()
        run: |
          n="${{ github.event.issue.number }}"
          if [[ "${{ steps.run1.outcome }}" == "success" || "${{ steps.run2.outcome }}" == "success" ]]; then
            if [[ "${{ steps.deliver.outcome }}" != "success" ]]; then
              echo "agent run succeeded but branch/PR delivery failed"
              gh issue comment "$n" --body "Builder produced no deliverable (no branch/PR could be created from its changes) — treat this run as failed and re-apply the trigger label to retry. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              exit 1
            fi
            echo "builder delivered branch + PR"; exit 0
          fi
          echo "both model attempts failed"
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Builder failed on both free models (Z.ai + OpenRouter fallback). Issue stays open for manual handling. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
