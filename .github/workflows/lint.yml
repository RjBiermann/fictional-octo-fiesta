name: Lint

# Three cheap gates:
# - actionlint on workflow changes (push): workflow-file bugs surface as opaque
#   GitHub "startup failure" runs otherwise.
# - Jackson version gate (PRs touching build files): Jackson must never be
#   bumped past 2.13.1 — newer versions break older Android devices.
# - Dependency review (same PRs): vulnerable/license-changed dependencies fail
#   the PR.

on:
  push:
    branches: [main, master]
    # Whole .github tree, not just workflows/actions: main requires the 7
    # status checks this workflow provides, and a path filter narrower than
    # the protected surface strands any other .github push (orchestrator.py,
    # audits/findings.json) on never-completing required checks — the
    # registry_sync push died exactly there (run 39607504429, spec #858).
    paths:
      - '.github/**'
      - '.pi/skills/verify-provider/**'
  pull_request:
    # No paths filter: required contexts that a filter can suppress leave
    # the PR BLOCKED forever (#859 registry PRs, #1420 docs-only PRs). A
    # list that must enumerate every surface is the bug — every job here
    # is seconds long, so run them on every PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    # Required context on PRs too: the pull_request exemption made the check
    # a permanent SKIP, so a PR editing workflow YAML was never linted
    # before merge (#1438 review).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error
          # gh-aw's generated .lock.yml harness line trips shellcheck
          # SC2086/SC2016 (info) in every lock file — ~28 results overflow
          # reviewdog's 20-annotation cap and crash the reporter
          # ("Too many results (annotations) in diff", runs on 2026-10-17
          # main). The 13 "unexpected key queue for concurrency" findings are
          # actionlint schema lag: concurrency.queue is a real Actions feature
          # (actions/languageservices#355; actionlint support pending #654).
          # Ignore both; real findings still surface.
          # regexes use bare dots for spaces/quotes — the reviewdog entrypoint
          # shell-evals these flags: parens/asterisks break eval with
          # "syntax error: unexpected (" (run 39084360811 on main)
          actionlint_flags: -ignore SC2...:info -ignore unexpected.key..queue..for..concurrency

  jackson:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Jackson must not exceed 2.13.1
        run: |
          # -n keeps file:line in the failure output (-h hid it, review #347 P1-7).
          # Comment-only lines that quote the coordinate are filtered out so a
          # comment like "never bump ... :2.17" cannot fail the gate.
          bad=$(grep -rEn --include=build.gradle.kts 'com\.fasterxml.*jackson.*:(2\.1[4-9]|2\.[2-9]|[3-9]\.)' . \
            | grep -vE ':[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [[ -n "$bad" ]]; then
            echo "$bad"
            echo "::error::Jackson must not be bumped past 2.13.1 — newer versions break older Android devices"
            exit 1
          fi

  # The orchestrator's unit suite ran in no CI job, so every rule it pins
  # (Rule 0 derivation, surrogate consumption/dedupe, readiness, parent
  # lookup) was local-only — the 2026-11-21 pipeline fixes each grew tests
  # that nothing executed (#1438 review).
  orchestrator-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "orchestrator unit suite"
        run: python3 -m unittest discover -s .github -p 'orchestrator_test.py' -v

  # The wizard template is vendored (skills-lock.json pins its hash), so the
  # #1479 fixes cannot be asserted inside it — a sync may rewrite them. This
  # check lives outside the vendored tree and fails when the guarantees go.
  wizard-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "wizard env-writer: 0600, atomic, symlink-through, dotenv round-trip"
        run: bash scripts/wizard-template-check.sh

  # #1390 recurred twice (#372): a hardcoded provider count in AGENTS.md
  # drifts silently. Assert it instead of trusting the last editor.
  provider-count:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "AGENTS.md provider count matches the tree"
        run: |
          actual=$(ls -d */build.gradle.kts | wc -l)
          stated=$(grep -oE 'containing [0-9]+ NSFW' AGENTS.md | grep -oE '[0-9]+' || true)
          if [[ -z "$stated" ]]; then
            echo "::error::could not find '<n> containing … NSFW' in AGENTS.md — keep that phrasing so the count stays asserted"
            exit 1
          fi
          echo "tree=$actual AGENTS.md=$stated"
          if [[ "$actual" != "$stated" ]]; then
            echo "::error::AGENTS.md says $stated providers, the tree builds $actual — update the number in the same PR that adds/removes a provider"
            exit 1
          fi

  # Replay harness for the #797 bug class (spec #889): drives the recorded
  # 2026-10-20 label-event history (#771/#768/#775/#767) through
  # orchestrator.py (closeout_healer / _fire_implement / _stamped_after_merge)
  # and asserts the invariants — merged-delivered stories are never re-fired
  # and only an OWNER post-merge status/planned re-arms. Cheap (stdlib, no
  # network), data-anchored, and must stay green on main.
  orchestrator-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Replay #797 label-event fixtures through orchestrator.py"
        run: python3 -m unittest discover -s .github/tests -p 'orchestrator_replay_test.py' -v

  # The stream-scheme gate is the check that catches the whole `data:`/`blob:` class (#1353):
  # a non-http source can never open on the app's HTTP-only datasource. Its self-check exists
  # but ran in no workflow, so the gate could regress unnoticed — assert it here, every PR.
  verify-scheme-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: verify.sh self-check (scheme gate + PYDOM invariants, offline)
        run: bash .pi/skills/verify-provider/scripts/verify_selfcheck.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v5

  # One-grep gate (issue #169 addendum 2): every provider registers inline via
  # BasePlugin() at the bottom of the provider file. Legacy ': Plugin()' classes
  # and pass-through *Provider.kt registration files creep back otherwise and
  # Builder runs keep shipping the legacy shape.
  plugin-shape:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No legacy Plugin() classes or pass-through provider files
        run: |
          # WatchPorn/FullPorner/Mangoporn keep Plugin(context) — context-requiring
          # constructors / openSettings (Mangoporn's settings dialog is a Plugin-only
          # feature; BasePlugin lacks it). Legacy shape is fully-qualified
          # `plugins.Plugin()`; bare `: Plugin()` and --exclude-dir don't survive the
          # globbed search roots (review #169 round 2).
          bad=$(grep -rnE --include='*.kt' '(:[[:space:]]*Plugin\(\)|plugins\.Plugin\(\))' \
            ./*/src/main/kotlin shared/src/main/kotlin 2>/dev/null \
            | grep -vE '^\./(WatchPorn|FullPorner|Mangoporn)/' || true)
          # Same roots as the legacy grep above — shared/ is deliberately in
          # scope for both halves of this gate, so a pass-through file dropped
          # into shared/ cannot slip past either check (review #347 P1-10).
          passthrough=$(find ./*/src/main/kotlin shared/src/main/kotlin -name '*Provider.kt' 2>/dev/null || true)
          if [[ -n "$bad" || -n "$passthrough" ]]; then
            [[ -n "$bad" ]] && { echo "legacy Plugin() class found:"; echo "$bad"; }
            [[ -n "$passthrough" ]] && { echo "pass-through provider file found:"; echo "$passthrough"; }
            echo "::error::Register inline BasePlugin() at the bottom of the provider file (issue #169, ADR-0002)"
            exit 1
          fi
