name: Lint

# Three cheap gates:
# - actionlint on workflow changes (push): workflow-file bugs surface as opaque
#   GitHub "startup failure" runs otherwise.
# - Jackson version gate (PRs touching build files): Jackson must never be
#   bumped past 2.13.1 — newer versions break older Android devices.
# - Dependency review (same PRs): vulnerable/license-changed dependencies fail
#   the PR.

on:
  push:
    branches: [main, master]
    paths: ['.github/workflows/**', '.github/actions/**']
  pull_request:
    paths: ['**/build.gradle.kts']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  jackson:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Jackson must not exceed 2.13.1
        run: |
          # -n keeps file:line in the failure output (-h hid it, review #347 P1-7).
          # Comment-only lines that quote the coordinate are filtered out so a
          # comment like "never bump ... :2.17" cannot fail the gate.
          bad=$(grep -rEn --include=build.gradle.kts 'com\.fasterxml.*jackson.*:(2\.1[4-9]|2\.[2-9]|[3-9]\.)' . \
            | grep -vE ':[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [[ -n "$bad" ]]; then
            echo "$bad"
            echo "::error::Jackson must not be bumped past 2.13.1 — newer versions break older Android devices"
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  # One-grep gate (issue #169 addendum 2): every provider registers inline via
  # BasePlugin() at the bottom of the provider file. Legacy ': Plugin()' classes
  # and pass-through *Provider.kt registration files creep back otherwise and
  # Builder runs keep shipping the legacy shape.
  plugin-shape:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No legacy Plugin() classes or pass-through provider files
        run: |
          # WatchPorn/FullPorner keep Plugin(context) — context-requiring constructors.
          # Legacy shape is fully-qualified `plugins.Plugin()`; bare `: Plugin()` and
          # --exclude-dir don't survive the globbed search roots (review #169 round 2).
          bad=$(grep -rnE --include='*.kt' '(:[[:space:]]*Plugin\(\)|plugins\.Plugin\(\))' \
            ./*/src/main/kotlin shared/src/main/kotlin 2>/dev/null \
            | grep -vE '^\./(WatchPorn|FullPorner)/' || true)
          # Same roots as the legacy grep above — shared/ is deliberately in
          # scope for both halves of this gate, so a pass-through file dropped
          # into shared/ cannot slip past either check (review #347 P1-10).
          passthrough=$(find ./*/src/main/kotlin shared/src/main/kotlin -name '*Provider.kt' 2>/dev/null || true)
          if [[ -n "$bad" || -n "$passthrough" ]]; then
            [[ -n "$bad" ]] && { echo "legacy Plugin() class found:"; echo "$bad"; }
            [[ -n "$passthrough" ]] && { echo "pass-through provider file found:"; echo "$passthrough"; }
            echo "::error::Register inline BasePlugin() at the bottom of the provider file (issue #169, ADR-0002)"
            exit 1
          fi
