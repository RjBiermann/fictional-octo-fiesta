name: PAT probe (disposable)

# One-off diagnostic for the AGENT_PAT delivery path (ADR-0004). Dispatches,
# reports whether secrets.AGENT_PAT is present and which token TYPE it is
# (prefix only — never the value), then attempts the exact push deliver-pr
# performs (this file itself is in the pushed tree, so the push requires
# workflows permission — the same wall that killed runs 4-5).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret presence + token type
        env:
          PAT: ${{ secrets.AGENT_PAT }}
        run: |
          if [[ -z "$PAT" ]]; then
            echo "AGENT_PAT: EMPTY at workflow runtime"
          else
            echo "AGENT_PAT: present, length=${#PAT}, prefix=${PAT:0:11}"
          fi

      - name: Push attempt (needs workflows permission)
        if: env.PAT != ''
        env:
          PAT: ${{ secrets.AGENT_PAT }}
        run: |
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/pat-probe-scratch" && echo PUSH_OK
