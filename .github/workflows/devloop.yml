# devloop: trigger-label events fire a build run.
# Install is pinned to a devloop tag — a broken devloop commit can't break this pipeline.
name: devloop
on:
  issues:
    types: [labeled]
  workflow_dispatch:

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ai-fix' ||
      github.event.label.name == 'ai-new-site' ||
      github.event.label.name == 'ai-remove-site' ||
      github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { java-version: "17", distribution: temurin }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install devloop (pinned)
        run: >-
          pip install
          git+https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/RjBiermann/devloop@v0.1.5
      - name: Install agent runtime (pi) + model config
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          npm i -g @earendil-works/pi-coding-agent
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json <<JSON
          {
            "providers": {
              "go": {
                "baseUrl": "https://opencode.ai/zen/go/v1",
                "api": "openai-completions",
                "apiKey": "$OPENCODE_API_KEY",
                "models": [
                  { "id": "glm-5.3-flash", "name": "GLM 5.3 Flash (Go)", "reasoning": true },
                  { "id": "deepseek-v4-flash", "name": "DeepSeek V4 Flash (Go)", "reasoning": true }
                ]
              }
            }
          }
          JSON
      - name: PAT push credentials (ADR-0004 — GITHUB_TOKEN cannot push workflow files)
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: >-
          git remote set-url --push origin
          "https://x-access-token:${AGENT_PAT}@github.com/RjBiermann/fictional-octo-fiesta.git"
      - name: Run pipeline
        run: devloop once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
