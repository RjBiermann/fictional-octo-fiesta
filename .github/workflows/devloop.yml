# devloop: trigger-label events fire a build run.
# Install is pinned to a devloop tag — a broken devloop commit can't break this pipeline.
name: devloop
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  push:
    branches: [main]     # main moving runs upkeep immediately (rebase
                         # stale PRs, rebuild on conflict) instead of
                         # waiting for the 30-min sweep
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # self-healing: pending labels survive skipped/failed runs

concurrency:
  group: devloop-pipeline    # serial by design; a scheduled run preempts nothing, waits instead
  cancel-in-progress: false

jobs:
  run:
    # reserved ai- prefix is the trigger contract (upstream devloop ADR-0003):
    # a config rename within the ai- namespace never orphans the trigger —
    # the workflow filter never hardcodes label names
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      startsWith(github.event.label.name, 'ai-') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'devloop/')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    # Least privilege (issue #350, from review #347 P0-3). Two credential channels:
    # - GITHUB_TOKEN drives the gh CLI inside the pipeline: issue
    #   create/edit/comment/close (spec sub-issues, error tails,
    #   close-out — ADR-0007), PR create/comment/close (delivery), and
    #   read-only gh api calls (trigger authority, comments). Hence
    #   issues + pull-requests write; contents stays read-only for the
    #   checkout fetch and the pinned devloop pip clone. The agent runs
    #   with this token + full shell access by design (repo is AI-first,
    #   no local development — ADR-0001; "agents never merge, humans
    #   decide" — AGENTS.md, ADR-0004/0007), so we
    #   do not hand it REST-API content-write capability it never uses.
    # - AGENT_PAT (ADR-0004) authenticates all git pushes: the step below
    #   unconditionally replaces the extraheader that checkout installed,
    #   so branch push/force-push/delete always authenticates with the
    #   PAT, never the GITHUB_TOKEN — contents: read is sufficient here.
    #   Caveat: this argument is verified against devloop v0.3.7 (the
    #   pinned tag). If a future devloop version performs a GitHub write
    #   outside issues/pull-requests (e.g. deleting a branch via
    #   `gh api -X DELETE .../git/refs/...`), contents: read fails loudly
    #   mid-run — re-audit this block when bumping the pinned tag.
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { java-version: "17", distribution: temurin }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install devloop (pinned)
        run: >-
          pip install
          git+https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/RjBiermann/devloop@v0.3.12
      - name: Install agent runtime (pi) + model config
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          npm i -g @earendil-works/pi-coding-agent
          mkdir -p ~/.pi/agent
          # Quoted heredoc: no shell expansion inside the block, so future
          # edits cannot inject inline Actions expressions as shell commands.
          # The key is interpolated explicitly via envsubst below (P0-7).
          cat > ~/.pi/agent/models.json <<'JSON'
          {
            "providers": {
              "go": {
                "baseUrl": "https://opencode.ai/zen/go/v1",
                "api": "openai-completions",
                "apiKey": "${OPENCODE_API_KEY}",
                "models": [
                  { "id": "glm-5.3-flash", "name": "GLM 5.3 Flash (Go)", "reasoning": true },
                  { "id": "deepseek-v4-flash", "name": "DeepSeek V4 Flash (Go)", "reasoning": true }
                ]
              }
            }
          }
          JSON
          # shellcheck disable=SC2016
          envsubst '$OPENCODE_API_KEY' < ~/.pi/agent/models.json > ~/.pi/agent/models.json.tmp \
            && mv ~/.pi/agent/models.json.tmp ~/.pi/agent/models.json
      - name: Install rtk output filter (pinned v0.49.0, checksum-verified)
        run: |
          # ADR-0009: rtk filters bash tool output before the agent reads it —
          # the CI runs' largest token sink is probe/gradle transcripts.
          # Pinned release + checksum: supply-chain gate, no latest-tag drift.
          cd /tmp
          curl -sSfL -o rtk.tar.gz "https://github.com/rtk-ai/rtk/releases/download/v0.49.0/rtk-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/rtk-ai/rtk/releases/download/v0.49.0/checksums.txt"
          grep "rtk-x86_64-unknown-linux-musl.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf rtk.tar.gz
          install -m 0755 rtk /usr/local/bin/rtk
          rtk init -g --agent pi
      - name: PAT credentials (ADR-0004 — GITHUB_TOKEN cannot push workflow files)
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          # replace the GITHUB_TOKEN header actions/checkout installed —
          # extraheader overrides remote-URL credentials, so the PAT must
          # live in the header itself (fetch + push both use it)
          B64=$(printf 'x-access-token:%s' "$AGENT_PAT" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $B64"
          # commit identity: devloop >= v0.3.7 sets it itself (start_work /
          # rebase_branch), only when unset — a human's config always wins
      - name: Run pipeline
        if: github.event_name != 'issue_comment'
        run: devloop once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run comment command
        if: github.event_name == 'issue_comment'
        run: devloop command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Close out merged devloop PR's issue
        if: github.event_name == 'pull_request'
        run: devloop merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
