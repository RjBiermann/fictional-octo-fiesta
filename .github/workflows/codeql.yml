name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 0 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Set up JDK 17
      if: matrix.build-mode == 'manual'
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    # CodeQL's Kotlin extractor doesn't support the repo's pinned Kotlin 2.4.20 yet:
    # the version check in codeql-java-agent.jar (KotlinInterceptor) throws
    # KotlinVersionTooRecentError for versions >= the hardcoded limit, which is still
    # exactly 2.4.20 in the newest bundle (2.27.0, action v4.38.0) — and its newest
    # bundled extractor plugin is 2.4.0. Downgrade to 2.4.10 for the scan run only —
    # real builds keep 2.4.20. Tracked in #388 — revert this whole block once the
    # limit passes 2.4.20 (re-check by strings-ing the new bundle's
    # codeql/java/tools/codeql-java-agent.jar for defaultAcceptableVersionLimitStr).
    - name: Build for scan
      if: matrix.build-mode == 'manual'
      run: |
        sed -i 's/kotlin-gradle-plugin:2\.4\.20/kotlin-gradle-plugin:2.4.10/' build.gradle.kts
        ./gradlew assemble

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
