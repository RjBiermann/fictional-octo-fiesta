name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 0 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Set up JDK 17
      if: matrix.build-mode == 'manual'
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    # CodeQL's Kotlin extractor doesn't support the repo's Kotlin 2.4.20 yet
    # (KotlinVersionTooRecentError, CodeQL 2.26.4); downgrade for the scan run
    # only — real builds keep 2.4.20. Revert this whole block once CodeQL
    # supports the pinned version.
    - name: Build for scan
      if: matrix.build-mode == 'manual'
      run: |
        sed -i 's/kotlin-gradle-plugin:2\.4\.20/kotlin-gradle-plugin:2.4.10/' build.gradle.kts
        ./gradlew assemble

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
